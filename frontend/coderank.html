<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeRank</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { background: #0b0f1a; color: #e4e7ec; font-family: ui-sans-serif, system-ui, sans-serif; }
  textarea, input, select { font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace; }
  .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar::-webkit-scrollbar-track { background: #111827; }
  .scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  .scrollbar::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  .status-QUEUED { color: #fbbf24; }
  .status-RUNNING { color: #60a5fa; }
  .status-SUCCESS { color: #34d399; }
  .status-ERROR { color: #f87171; }
  .status-TIMEOUT { color: #fb923c; }
  .pulse-dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 6px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API_BASE = "http://localhost:8080";

// ---------- API helpers ----------
async function api(path, opts = {}) {
  const token = localStorage.getItem("coderank_token");
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const msg = body?.message || body?.error || `HTTP ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return body;
}

// ---------- Auth screen ----------
function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    setLoading(true); setError("");
    try {
      const body = await api(`/api/v1/auth/${mode}`, {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });
      localStorage.setItem("coderank_token", body.token);
      localStorage.setItem("coderank_email", email);
      onAuthed(email);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
        <div className="flex items-center gap-3 mb-8">
          <div className="w-10 h-10 rounded-lg bg-indigo-500 flex items-center justify-center text-xl font-bold">C</div>
          <div>
            <h1 className="text-2xl font-bold">CodeRank</h1>
            <p className="text-xs text-slate-500">Online code execution platform</p>
          </div>
        </div>

        <div className="flex gap-2 mb-6 p-1 bg-slate-800 rounded-lg">
          <button onClick={() => setMode("login")} className={`flex-1 py-2 rounded-md text-sm font-medium transition ${mode === "login" ? "bg-slate-700 text-white" : "text-slate-400 hover:text-white"}`}>Sign in</button>
          <button onClick={() => setMode("register")} className={`flex-1 py-2 rounded-md text-sm font-medium transition ${mode === "register" ? "bg-slate-700 text-white" : "text-slate-400 hover:text-white"}`}>Create account</button>
        </div>

        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="block text-xs text-slate-400 mb-1">Email</label>
            <input type="email" required value={email} onChange={e => setEmail(e.target.value)}
              className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label className="block text-xs text-slate-400 mb-1">Password</label>
            <input type="password" required minLength={8} value={password} onChange={e => setPassword(e.target.value)}
              className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500" />
            {mode === "register" && <p className="text-xs text-slate-500 mt-1">At least 8 characters</p>}
          </div>
          {error && <div className="text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2">{error}</div>}
          <button disabled={loading} type="submit"
            className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg font-medium transition">
            {loading ? "..." : (mode === "login" ? "Sign in" : "Create account")}
          </button>
        </form>

        <p className="text-xs text-slate-600 mt-6 text-center">
          API: <code className="text-slate-400">{API_BASE}</code>
        </p>
      </div>
    </div>
  );
}

// ---------- Status pill ----------
function StatusBadge({ status }) {
  const isLive = status === "QUEUED" || status === "RUNNING";
  return (
    <span className={`inline-flex items-center text-xs font-medium status-${status} ${isLive ? "pulse-dot" : ""}`}>
      {status}
    </span>
  );
}

// ---------- Output panel ----------
function OutputPanel({ submission }) {
  if (!submission) {
    return (
      <div className="h-full flex items-center justify-center text-slate-600 text-sm">
        Submit code to see output
      </div>
    );
  }
  const { status, stdout, stderr, exitCode, execTimeMs } = submission;
  return (
    <div className="h-full flex flex-col">
      <div className="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <StatusBadge status={status} />
        <div className="text-xs text-slate-500 flex gap-4">
          {execTimeMs != null && <span>{execTimeMs} ms</span>}
          {exitCode != null && <span>exit {exitCode}</span>}
        </div>
      </div>
      <div className="flex-1 overflow-auto scrollbar p-4 text-sm font-mono">
        {stdout && (
          <div className="mb-3">
            <div className="text-xs text-slate-500 mb-1">stdout</div>
            <pre className="whitespace-pre-wrap text-slate-200">{stdout}</pre>
          </div>
        )}
        {stderr && (
          <div className="mb-3">
            <div className="text-xs text-red-400 mb-1">stderr</div>
            <pre className="whitespace-pre-wrap text-red-300">{stderr}</pre>
          </div>
        )}
        {!stdout && !stderr && status !== "QUEUED" && status !== "RUNNING" && (
          <div className="text-slate-600 text-sm">No output</div>
        )}
        {(status === "QUEUED" || status === "RUNNING") && (
          <div className="text-slate-500 text-sm">Running in isolated container...</div>
        )}
      </div>
    </div>
  );
}

// ---------- History list ----------
function HistoryList({ submissions, current, onSelect }) {
  if (!submissions.length) {
    return <div className="p-4 text-xs text-slate-600">No submissions yet</div>;
  }
  return (
    <div className="overflow-auto scrollbar">
      {submissions.map(s => (
        <button key={s.id} onClick={() => onSelect(s)}
          className={`w-full text-left px-4 py-3 border-b border-slate-800 hover:bg-slate-800/50 transition ${current?.id === s.id ? "bg-slate-800/70" : ""}`}>
          <div className="flex items-center justify-between mb-1">
            <StatusBadge status={s.status} />
            <span className="text-[10px] text-slate-600">{new Date(s.createdAt).toLocaleTimeString()}</span>
          </div>
          <div className="text-xs text-slate-500 truncate font-mono">{s.id.slice(0, 8)}</div>
          {s.execTimeMs != null && <div className="text-[10px] text-slate-600 mt-0.5">{s.execTimeMs} ms</div>}
        </button>
      ))}
    </div>
  );
}

// ---------- Dashboard ----------
function Dashboard({ email, onLogout }) {
  const [languages, setLanguages] = useState([]);
  const [languageId, setLanguageId] = useState(null);
  const [code, setCode] = useState('print("Hello, CodeRank!")');
  const [stdin, setStdin] = useState("");
  const [showStdin, setShowStdin] = useState(false);
  const [submissions, setSubmissions] = useState([]);
  const [current, setCurrent] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const pollRef = useRef(null);

  // Load languages once
  useEffect(() => {
    api("/api/v1/languages").then(list => {
      setLanguages(list);
      if (list.length) setLanguageId(list[0].id);
    }).catch(e => setError(e.message));
  }, []);

  // Load history
  const loadHistory = useCallback(async () => {
    try {
      const list = await api("/api/v1/submissions?size=50");
      setSubmissions(list);
    } catch (e) {
      if (e.status === 401 || e.status === 403) onLogout();
    }
  }, [onLogout]);

  useEffect(() => { loadHistory(); }, [loadHistory]);

  // Poll current submission until terminal
  useEffect(() => {
    if (!current) return;
    if (["SUCCESS", "ERROR", "TIMEOUT"].includes(current.status)) {
      if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
      return;
    }
    pollRef.current = setInterval(async () => {
      try {
        const fresh = await api(`/api/v1/submissions/${current.id}`);
        setCurrent(fresh);
        setSubmissions(prev => prev.map(s => s.id === fresh.id ? fresh : s));
      } catch (e) { /* swallow polling errors */ }
    }, 1200);
    return () => { if (pollRef.current) clearInterval(pollRef.current); };
  }, [current?.id, current?.status]);

  async function runCode() {
    if (!languageId || !code.trim()) return;
    setSubmitting(true); setError("");
    try {
      const body = await api("/api/v1/submissions", {
        method: "POST",
        body: JSON.stringify({ languageId, sourceCode: code, stdin: stdin || null }),
      });
      setCurrent(body);
      setSubmissions(prev => [body, ...prev]);
    } catch (e) {
      setError(e.message);
      if (e.status === 401 || e.status === 403) onLogout();
    } finally {
      setSubmitting(false);
    }
  }

  function handleTabKey(e) {
    if (e.key === "Tab") {
      e.preventDefault();
      const ta = e.target;
      const start = ta.selectionStart, end = ta.selectionEnd;
      const newVal = code.slice(0, start) + "    " + code.slice(end);
      setCode(newVal);
      setTimeout(() => { ta.selectionStart = ta.selectionEnd = start + 4; }, 0);
    }
  }

  return (
    <div className="min-h-screen flex flex-col">
      {/* Header */}
      <header className="border-b border-slate-800 px-6 py-3 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <div className="w-8 h-8 rounded-md bg-indigo-500 flex items-center justify-center font-bold">C</div>
          <span className="font-semibold">CodeRank</span>
        </div>
        <div className="flex items-center gap-4 text-sm">
          <span className="text-slate-400">{email}</span>
          <button onClick={onLogout} className="text-slate-500 hover:text-white">Sign out</button>
        </div>
      </header>

      {/* Main */}
      <div className="flex-1 grid grid-cols-12 gap-0 overflow-hidden" style={{ height: "calc(100vh - 57px)" }}>
        {/* Left: editor */}
        <div className="col-span-7 flex flex-col border-r border-slate-800">
          <div className="px-4 py-3 border-b border-slate-800 flex items-center gap-3">
            <select value={languageId || ""} onChange={e => setLanguageId(Number(e.target.value))}
              className="bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
              {languages.map(l => <option key={l.id} value={l.id}>{l.name} {l.version}</option>)}
            </select>
            <button onClick={() => setShowStdin(s => !s)}
              className="text-xs text-slate-400 hover:text-white px-2 py-1 rounded hover:bg-slate-800">
              {showStdin ? "Hide" : "Show"} stdin
            </button>
            <div className="flex-1" />
            <button onClick={runCode} disabled={submitting || !languageId}
              className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed rounded-md text-sm font-medium transition flex items-center gap-2">
              {submitting ? "Submitting..." : "▶ Run"}
            </button>
          </div>

          <textarea value={code} onChange={e => setCode(e.target.value)} onKeyDown={handleTabKey}
            spellCheck={false}
            className="flex-1 w-full bg-slate-950 text-slate-100 p-4 resize-none focus:outline-none text-sm leading-6 scrollbar"
            placeholder="# Write your code..." />

          {showStdin && (
            <div className="border-t border-slate-800">
              <div className="px-4 py-2 text-xs text-slate-500 border-b border-slate-800">stdin</div>
              <textarea value={stdin} onChange={e => setStdin(e.target.value)} spellCheck={false}
                className="w-full bg-slate-950 text-slate-100 p-3 resize-none focus:outline-none text-sm h-24 scrollbar"
                placeholder="Input for your program..." />
            </div>
          )}

          {error && (
            <div className="px-4 py-2 bg-red-500/10 border-t border-red-500/20 text-sm text-red-400">{error}</div>
          )}
        </div>

        {/* Right: output + history */}
        <div className="col-span-5 flex flex-col">
          <div className="flex-1 overflow-hidden">
            <OutputPanel submission={current} />
          </div>
          <div className="border-t border-slate-800 flex flex-col" style={{ maxHeight: "40%" }}>
            <div className="px-4 py-2 text-xs uppercase tracking-wide text-slate-500 flex items-center justify-between border-b border-slate-800">
              <span>History</span>
              <button onClick={loadHistory} className="text-slate-500 hover:text-white">↻</button>
            </div>
            <HistoryList submissions={submissions} current={current} onSelect={setCurrent} />
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- App ----------
function App() {
  const [email, setEmail] = useState(localStorage.getItem("coderank_email"));
  const token = localStorage.getItem("coderank_token");

  function logout() {
    localStorage.removeItem("coderank_token");
    localStorage.removeItem("coderank_email");
    setEmail(null);
  }

  if (!email || !token) return <AuthScreen onAuthed={setEmail} />;
  return <Dashboard email={email} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
